name: Publish

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'app/**'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    # Skip running release workflow on main if the commit is a release commit from beta
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}

    permissions:
      id-token: write
      deployments: write
      contents: write

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Install Node and NPM
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install and build
        working-directory: app
        run: |
          npm install
          npm run postinstall
          npm run build

      - name: Get version
        if: github.ref == 'refs/heads/beta' # TODO: remove once out of beta
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create draft release
        if: github.ref == 'refs/heads/beta' # TODO: remove once out of beta
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $VERSION --draft --title "v$VERSION" --notes "Release notes will be generated automatically."

      - name: Build and upload assets
        if: github.ref == 'refs/heads/beta' # TODO: remove once out of beta
        working-directory: app
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          echo "VERSION: ${{ env.VERSION }}"
          # Remove --publish flag to prevent electron-builder from creating its own release
          npm exec electron-builder -- -mwl -c.extraMetadata.version=$VERSION
          # Manually upload the built assets to the draft release
          for file in dist/*.{dmg,exe,AppImage,zip,yml,blockmap}; do
            if [ -f "$file" ]; then
              gh release upload $VERSION "$file" --clobber
            fi
          done

      - name: Run semantic-release
        if: github.ref == 'refs/heads/beta' # TODO: remove once out of beta
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release with a custom plugin configuration to update existing release
          npx semantic-release

      - name: Publish Release
        if: github.ref == 'refs/heads/beta' # TODO: remove once out of beta
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            gh release edit $VERSION --draft=false --prerelease
          else
            gh release edit $VERSION --draft=false --latest
          fi

      - name: Merge main into beta
        if: github.ref == 'refs/heads/main' # Only run this step when on main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin beta:beta
          git checkout beta
          git merge --no-ff origin/main -m "chore: merge main into beta after release [skip ci]"
          git push origin beta
